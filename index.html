<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Juego interactivo: Elige tu destino entre el botón rojo y el botón azul para descubrir si ganas o pierdes.">
  <title>Elige tu destino</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Fondo dinámico con imágenes de Lady Gaga -->
  <div class="bg-slideshow" aria-hidden="true">
    <div class="bg-slide slide-1"></div>
    <div class="bg-slide slide-2"></div>
    <div class="bg-slide slide-3"></div>
    <div class="bg-slide slide-4"></div>
    <div class="bg-overlay"></div>
  </div>

  <canvas id="confetti-canvas"></canvas>

  <main class="game-container">
    <div class="card">
      <header class="game-header">
        <span class="badge">Sorteo de la suerte</span>
        <h1 id="main-title">Elige tu destino</h1>
        <p class="subtitle" id="subtitle-text">¿Qué camino eliges hoy? Uno te llevará a la victoria... o a la derrota.</p>
      </header>

      <section class="choice-section" aria-label="Botones de elección">
        <button id="btn-red" class="destiny-btn btn-red" type="button" aria-label="Elegir botón rojo">
          <span class="btn-icon">🔴</span>
          <span class="btn-text">Rojo</span>
        </button>

        <button id="btn-blue" class="destiny-btn btn-blue" type="button" aria-label="Elegir botón azul">
          <span class="btn-icon">🔵</span>
          <span class="btn-text">Azul</span>
        </button>
      </section>

      <section id="result-container" class="result-container hidden" aria-live="polite">
        <div id="result-badge" class="result-badge">
          <span id="result-icon" class="result-emoji"></span>
          <h2 id="result-text" class="result-title"></h2>
          <p id="result-desc" class="result-description"></p>
        </div>

        <button id="btn-reset" class="btn-reset" type="button">
          <svg class="reset-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
            <path d="M3 3v5h5"/>
            <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
            <path d="M21 21v-5h-5"/>
          </svg>
          Volver a jugar
        </button>
      </section>

      <footer class="scoreboard">
        <div class="score-pill win-pill">
          <span class="score-label">Victorias</span>
          <span id="wins-count" class="score-number">0</span>
        </div>
        <div class="score-pill loss-pill">
          <span class="score-label">Derrotas</span>
          <span id="losses-count" class="score-number">0</span>
        </div>
      </footer>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
